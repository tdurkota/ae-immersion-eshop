name: Marketplace CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ${{ secrets.ACR_REGISTRY_NAME }}.azurecr.io
  ASPIRE_CLI_VERSION: "latest"
  DOTNET_VERSION: "10.0.x"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore eShop.Web.slnf

      - name: Build solution
        run: dotnet build eShop.Web.slnf --configuration Release --no-restore -p:LibraryRestore=false

      # TODO: Enable tests after initial deployment is working
