  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [ build-and-test ]
    # if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    permissions:
      contents: read
    environment:
      name: staging
    outputs:
      staging-url: ${{ steps.get-staging-url.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Aspire CLI
        run: dotnet tool install -g Aspire.Cli --version '${{ env.ASPIRE_CLI_VERSION }}'

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps (Staging)
        run: |
          aspire deploy --non-interactive --from-module ${{ secrets.ASPIRE_MODULE_PATH }}
        env:
          Azure__SubscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          Azure__ResourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          Azure__Location: ${{ secrets.AZURE_LOCATION }}
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"
        continue-on-error: false

      - name: Get Staging URL
        id: get-staging-url
        run: |
          # Get the webapp FQDN from deployed Container App
          WEBAPP_URL=$(az containerapp show --name webapp --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$WEBAPP_URL" >> $GITHUB_OUTPUT
          echo "Staging URL: https://$WEBAPP_URL"

  e2e-tests:
    name: E2E Tests (Marketplace Flow)
    runs-on: ubuntu-latest
    needs: [ deploy-staging ]
    # if: github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
  
      - name: Install Playwright dependencies
        run: npx playwright install --with-deps
  
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          STAGING_URL: ${{ needs.deploy-staging.outputs.staging-url }}
  
      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/

