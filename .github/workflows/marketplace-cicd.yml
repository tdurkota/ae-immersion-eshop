  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [ build-and-test ]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    permissions:
      contents: read
    environment:
      name: staging
      url: https://eshop-staging.azurecontainerapps.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Aspire CLI
        run: dotnet tool install -g Aspire.Cli --version ${{ env.ASPIRE_CLI_VERSION }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps (Staging)
        run: |
          aspire publish --from-module ${{ secrets.ASPIRE_MODULE_PATH }} \
            --provision-if-not-exists \
            --subscription-id ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --location ${{ secrets.AZURE_LOCATION }} \
            --environment-name eshop-staging
        env:
          AZURE_CONTAINER_REGISTRY_ENDPOINT: https://${{ secrets.ACR_REGISTRY_NAME }}.azurecr.io
          AZURE_CONTAINER_REGISTRY_USERNAME: ${{ secrets.ACR_USERNAME }}
          AZURE_CONTAINER_REGISTRY_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        continue-on-error: false

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ build-and-test ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
    environment:
      name: production
      url: https://eshop-marketplace.azurecontainerapps.io
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Aspire CLI
        run: dotnet tool install -g Aspire.Cli --version ${{ env.ASPIRE_CLI_VERSION }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps (Production)
        run: |
          aspire publish --from-module ${{ secrets.ASPIRE_MODULE_PATH }} \
            --provision-if-not-exists \
            --subscription-id ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --location ${{ secrets.AZURE_LOCATION }} \
            --environment-name eshop-production
        env:
          AZURE_CONTAINER_REGISTRY_ENDPOINT: https://${{ secrets.ACR_REGISTRY_NAME }}.azurecr.io
          AZURE_CONTAINER_REGISTRY_USERNAME: ${{ secrets.ACR_USERNAME }}
          AZURE_CONTAINER_REGISTRY_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        continue-on-error: false

