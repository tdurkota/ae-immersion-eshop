openapi: 3.0.3
info:
  title: Ordering.API Seller and Commission Extensions
  version: 1.0.0
  description: >
    Contract extension for Ordering.API endpoints that adds seller attribution,
    commission tracking, seller validation, and seller reporting filters for marketplace orders.
x-api-target:
  service: Ordering.API
  changeId: api-contracts-ordering
  scope:
    - POST /api/orders
    - GET /api/orders/{orderId}
    - GET /api/orders
x-immutability-notes:
  - Commission rates are fixed at order creation and never updated, even if the seller's rate changes later.
  - sellerId, sellerName, commissionRate, commissionAmount, sellerAmount, and subtotal are stored as order-time snapshots per line item.
  - Commission and seller payout values are rounded to 2 decimal places (cents) when the order is created.
tags:
  - name: Orders
    description: Order creation and retrieval with seller commission tracking.
paths:
  /api/orders:
    post:
      tags:
        - Orders
      summary: Create order
      description: >
        Creates a new order. The request body is unchanged, but validation now checks the status
        of every seller referenced by seller-owned line items before the order is accepted.
      x-validation-rules:
        - Request body shape is unchanged from the existing Ordering.API contract.
        - Platform products without a sellerId bypass seller-status validation.
        - Seller-owned products must include sellerId.
        - Seller-owned products must reference an active seller.
        - Commission rate must be a valid decimal between 0 and 1 inclusive at order-creation time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              unchangedRequest:
                summary: Existing create-order request body
                value:
                  items:
                    - productId: prod-1
                      quantity: 1
                      unitPrice: 100.00
                  street: 123 Main St
                  city: Seattle
                  state: WA
                  country: USA
                  zipCode: "98101"
      responses:
        '201':
          description: Order created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
              examples:
                createdMultiSellerOrder:
                  summary: Order created with platform and seller products
                  value:
                    orderId: ord-1001
                    status: submitted
                    orderDate: '2026-09-15T15:17:44Z'
                    currency: USD
                    total: 325.00
                    lineItems:
                      - itemId: line-1
                        productId: prod-1
                        productName: Platform Gift Card
                        quantity: 1
                        price: 100.00
                        sellerId: null
                        sellerName: null
                        commissionRate: null
                        commissionAmount: null
                        sellerAmount: null
                        subtotal: 100.00
                      - itemId: line-2
                        productId: prod-2
                        productName: Seller One Mug
                        quantity: 1
                        price: 50.00
                        sellerId: seller-1
                        sellerName: Seller One
                        commissionRate: 0.15
                        commissionAmount: 7.50
                        sellerAmount: 42.50
                        subtotal: 50.00
                      - itemId: line-3
                        productId: prod-3
                        productName: Seller Two Shirt
                        quantity: 1
                        price: 75.00
                        sellerId: seller-2
                        sellerName: Seller Two
                        commissionRate: 0.10
                        commissionAmount: 7.50
                        sellerAmount: 67.50
                        subtotal: 75.00
        '400':
          description: >
            Validation failed because a seller was suspended or inactive, commission data was invalid,
            or a seller-owned product was missing sellerId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                sellerSuspended:
                  summary: Seller is suspended or inactive
                  value:
                    type: https://httpstatuses.com/400
                    title: Bad Request
                    status: 400
                    detail: Cannot order from suspended seller
                    errors:
                      items[1].sellerId:
                        - Cannot order from suspended seller
                invalidCommissionRate:
                  summary: Commission rate outside allowed range
                  value:
                    type: https://httpstatuses.com/400
                    title: Bad Request
                    status: 400
                    detail: Invalid commission rate
                    errors:
                      items[1].commissionRate:
                        - Invalid commission rate
                missingSellerId:
                  summary: Seller product omitted sellerId
                  value:
                    type: https://httpstatuses.com/400
                    title: Bad Request
                    status: 400
                    detail: Seller product but sellerId missing in order
                    errors:
                      items[1].sellerId:
                        - Seller product but sellerId missing in order
    get:
      tags:
        - Orders
      summary: List orders
      description: >
        Returns orders with seller attribution per line item. Platform administrators can filter by sellerId
        for marketplace reporting; the filter matches orders containing at least one line item for that seller.
      parameters:
        - name: sellerId
          in: query
          required: false
          description: >
            Optional seller filter for platform reporting. When provided, only orders containing at least one
            line item for the specified seller are returned. Platform products with null sellerId are excluded
            from this filter match.
          schema:
            type: string
      responses:
        '200':
          description: Paginated order list with seller information on each line item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
              examples:
                sellerFilteredResults:
                  summary: Admin report filtered by sellerId
                  value:
                    pageNumber: 1
                    pageSize: 20
                    totalCount: 1
                    items:
                      - orderId: ord-1001
                        status: submitted
                        orderDate: '2026-09-15T15:17:44Z'
                        currency: USD
                        total: 125.00
                        lineItems:
                          - itemId: line-2
                            productId: prod-2
                            productName: Seller One Mug
                            quantity: 1
                            price: 50.00
                            sellerId: seller-1
                            sellerName: Seller One
                            commissionRate: 0.15
                            commissionAmount: 7.50
                            sellerAmount: 42.50
                            subtotal: 50.00
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /api/orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Get order detail
      description: >
        Returns full order details, including immutable seller and commission snapshots for every line item.
      parameters:
        - name: orderId
          in: path
          required: true
          description: Unique order identifier.
          schema:
            type: string
      responses:
        '200':
          description: Order detail with line-item commission breakdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
              examples:
                multiSellerOrder:
                  summary: Multi-seller order with platform and seller products
                  value:
                    orderId: ord-1001
                    status: submitted
                    orderDate: '2026-09-15T15:17:44Z'
                    currency: USD
                    total: 225.00
                    lineItems:
                      - itemId: line-1
                        productId: prod-1
                        productName: Platform Gift Card
                        quantity: 1
                        price: 100.00
                        sellerId: null
                        sellerName: null
                        commissionRate: null
                        commissionAmount: null
                        sellerAmount: null
                        subtotal: 100.00
                      - itemId: line-2
                        productId: prod-2
                        productName: Seller One Mug
                        quantity: 1
                        price: 50.00
                        sellerId: seller-1
                        sellerName: Seller One
                        commissionRate: 0.15
                        commissionAmount: 7.50
                        sellerAmount: 42.50
                        subtotal: 50.00
                      - itemId: line-3
                        productId: prod-3
                        productName: Seller Two Shirt
                        quantity: 1
                        price: 75.00
                        sellerId: seller-2
                        sellerName: Seller Two
                        commissionRate: 0.10
                        commissionAmount: 7.50
                        sellerAmount: 67.50
                        subtotal: 75.00
        '404':
          description: Order not found.
components:
  schemas:
    CreateOrderRequest:
      type: object
      description: Existing create-order request contract. Request payload shape is unchanged by this extension.
      required:
        - items
        - street
        - city
        - country
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderLineItemRequest'
        street:
          type: string
        city:
          type: string
        state:
          type: string
          nullable: true
        country:
          type: string
        zipCode:
          type: string
          nullable: true
    CreateOrderLineItemRequest:
      type: object
      required:
        - productId
        - quantity
        - unitPrice
      properties:
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          format: double
          minimum: 0
    OrderListResponse:
      type: object
      required:
        - pageNumber
        - pageSize
        - totalCount
        - items
      properties:
        pageNumber:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalCount:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
    OrderSummary:
      type: object
      required:
        - orderId
        - status
        - orderDate
        - currency
        - total
        - lineItems
      properties:
        orderId:
          type: string
        status:
          type: string
        orderDate:
          type: string
          format: date-time
        currency:
          type: string
        total:
          type: number
          format: double
          minimum: 0
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineItem'
    OrderDetailResponse:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
      description: >
        Order detail response including immutable seller and commission fields captured at order-creation time.
    OrderLineItem:
      type: object
      description: >
        Immutable order line snapshot. subtotal, commissionAmount, and sellerAmount are rounded to 2 decimal places
        when the order is created. For platform products, sellerId, sellerName, commissionRate, commissionAmount,
        and sellerAmount are null.
      required:
        - itemId
        - productId
        - productName
        - quantity
        - price
        - subtotal
      properties:
        itemId:
          type: string
        productId:
          type: string
        productName:
          type: string
        quantity:
          type: integer
          minimum: 1
        price:
          type: number
          format: double
          minimum: 0
          description: Unit price charged at checkout. Free products use price = 0.
        sellerId:
          type: string
          nullable: true
          description: Seller identifier for seller-owned products; null for platform products.
        sellerName:
          type: string
          nullable: true
          description: Seller display name captured at order creation; null for platform products.
        commissionRate:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 1
          description: >
            Seller commission rate captured at order creation. Null for platform products.
            Zero commission is allowed for free-tier sellers.
        commissionAmount:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: >
            Calculated as round((price * quantity) * commissionRate, 2). Null for platform products.
        sellerAmount:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: >
            Calculated as round((price * quantity) - commissionAmount, 2). Null for platform products.
        subtotal:
          type: number
          format: double
          minimum: 0
          description: Calculated as round(price * quantity, 2).
      x-calculation-rules:
        subtotal: round(price * quantity, 2)
        commissionAmount: round((price * quantity) * commissionRate, 2)
        sellerAmount: round((price * quantity) - commissionAmount, 2)
      x-edge-cases:
        - Zero commission is valid and returns commissionAmount = 0.00.
        - Free products are valid and return subtotal = 0.00, commissionAmount = 0.00, sellerAmount = 0.00.
    ValidationProblem:
      type: object
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
